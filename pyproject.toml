[project]
name = "portalcut"
version = "0.1.0"
description = "Basketball game video -> highlight clips for one player"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "rfdetr>=1.12.1",
    "supervision>=0.32.0",
    "trackers>=2.7.0",
    "anthropic>=2.12.0",
]

[project.scripts]
portalcut = "portalcut.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
